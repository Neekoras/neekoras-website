<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Inscryption</title>
    <!-- Web port by Reeyuki (github.com/Reeyuki/InscryptionWebport). The build loads from jsDelivr. -->
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            background: #000;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        #unity-canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
            outline: none;
        }
    </style>
</head>

<body>
    <script>
        // The port shows a "Port by ..." popup once the game starts. Drop that one, keep any other alert.
        (function () {
            var nativeAlert = window.alert;
            window.alert = function (message) {
                if (/yukios|^\s*port by/i.test(String(message))) return;
                return nativeAlert.apply(this, arguments);
            };
        })();
    </script>
    <script src="/games/shared/loader.js?v=8"></script>
    <script>
        var gameLoader = GameLoader({
            title: "Inscryption",
            totalBytes: 1605844621, // the data and wasm parts below
            note: "The first load downloads about 1.5 GB. Your browser keeps it afterward, so the next visit starts much faster.",
        });
    </script>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1" hidden></canvas>
    </div>
    <script src="/games/shared/tabpause.js?v=2"></script>
    <script src="cloudsave.js?v=1"></script>
    <script>
        // The game build is served from the upstream repository, pinned to one commit so every part matches.
        var COMMIT = "a6069ee4139036ac01cca34a1a008ffc543469ac";
        var BUILD = "https://cdn.jsdelivr.net/gh/Reeyuki/InscryptionWebport@" + COMMIT + "/Build/";
        var DATA = "473b9593aa93436d0dfd3c30217f126b.data.part_";
        var DATA_PARTS = 73; // part_aa to part_cu
        var WASM = "2a21aa2df9743ada0aa5cac7d789934d.wasm.part_";
        var WASM_PARTS = 5;  // part_00 to part_04

        // Parts are saved in the browser after the first visit, so later visits skip the download.
        // The cache name carries the pinned commit, so a new build never mixes with old parts.
        var CACHE_NAME = "inscryption-" + COMMIT.slice(0, 8);
        var PARALLEL = 6; // parts downloaded at once
        var cachePromise = ("caches" in window)
            ? caches.open(CACHE_NAME).catch(() => null)
            : Promise.resolve(null);
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

        var loadedBytes = 0;
        function addBytes(n) {
            loadedBytes += n;
            gameLoader.download(loadedBytes);
        }

        // Gets one part: from the browser's saved copy if there is one, otherwise from the network,
        // adding its bytes to the loading screen as they arrive and saving it for next time.
        async function fetchPart(url) {
            const cache = await cachePromise;
            if (cache) {
                const hit = await cache.match(url).catch(() => null);
                if (hit) {
                    const blob = await hit.blob();
                    addBytes(blob.size);
                    return blob;
                }
            }
            for (let attempt = 0; ; attempt++) {
                try {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error("HTTP " + res.status + " for " + url);
                    const reader = res.body.getReader();
                    const chunks = [];
                    let got = 0;
                    try {
                        for (;;) {
                            const step = await reader.read();
                            if (step.done) break;
                            chunks.push(step.value);
                            got += step.value.length;
                            addBytes(step.value.length);
                        }
                    } catch (e) {
                        addBytes(-got); // take back this attempt's bytes before retrying
                        throw e;
                    }
                    const blob = new Blob(chunks);
                    // A full disk or a browser that limits storage only means the next visit downloads again.
                    if (cache) cache.put(url, new Response(blob)).catch(() => {});
                    return blob;
                } catch (e) {
                    if (attempt >= 3) throw e;
                    await new Promise((r) => setTimeout(r, 1000 * (attempt + 1)));
                }
            }
        }

        function dataSuffix(i) {
            var a = "abcdefghijklmnopqrstuvwxyz";
            return a[Math.floor(i / 26)] + a[i % 26];
        }
        function wasmSuffix(i) {
            return (i < 10 ? "0" : "") + i;
        }

        // Fetches the parts a few at a time and joins them, in order, into one file the engine can read.
        async function mergeFiles(name, count, suffix, type) {
            const blobs = new Array(count);
            let next = 0;
            async function worker() {
                while (next < count) {
                    const i = next++;
                    blobs[i] = await fetchPart(BUILD + name + suffix(i));
                }
            }
            await Promise.all(Array.from({ length: Math.min(PARALLEL, count) }, worker));
            return URL.createObjectURL(new Blob(blobs, type ? { type: type } : {}));
        }

        (async () => {
            const [dataUrl, wasmUrl] = await Promise.all([
                mergeFiles(DATA, DATA_PARTS, dataSuffix),
                mergeFiles(WASM, WASM_PARTS, wasmSuffix, "application/wasm"),
            ]);

            await new Promise((resolve, reject) => {
                const script = document.createElement("script");
                script.src = BUILD + "7a2dbded24d57e056180125b1583e7c4.loader.js";
                script.onload = resolve;
                script.onerror = () => reject(new Error("Could not load the game loader."));
                document.body.appendChild(script);
            });

            gameLoader.starting();
            const canvas = document.querySelector("#unity-canvas");
            canvas.hidden = false;
            const instance = await createUnityInstance(canvas, {
                dataUrl: dataUrl,
                frameworkUrl: BUILD + "7492dd364cd7595cfa9d018ad373b295.framework.js",
                codeUrl: wasmUrl,
                streamingAssetsUrl: BUILD.replace(/Build\/$/, "StreamingAssets"),
                companyName: "Daniel Mullins Games",
                productName: "Inscryption",
                productVersion: "Release",
            }, () => gameLoader.starting());
            gameLoader.done();
            TabPause.attach(instance.Module);
        })().catch((e) => {
            console.error(e);
            gameLoader.fail(e && e.message ? e.message : "The game could not load.");
        });
    </script>
</body>

</html>
