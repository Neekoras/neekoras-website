<!DOCTYPE html>
<html lang="en-us">

<head>
    <base href="https://cdn.jsdelivr.net/gh/web-ports/hollow-knight-silksong@bcbe014765f2f6ca4b1d82ac25755a0299a600ab/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Hollow Knight Silksong</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/instrument-serif@5/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/400.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #231F20;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
        #unity-canvas { background: #231F20; }
        #unity-mobile-warning { display: none; position: fixed; left: 50%; top: 5%; transform: translate(-50%); background: #fff3c4; padding: 10px; color: #231F20; font-family: Inter, system-ui, sans-serif; }

        #sk-loader { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at 50% 40%, #2c2729 0%, #1a1718 60%, #121011 100%);
            color: #ece6da; font-family: Inter, system-ui, sans-serif; transition: opacity .6s ease; padding: 24px; box-sizing: border-box; }
        #sk-loader.sk-gone { opacity: 0; pointer-events: none; }
        .sk-inner { width: 100%; max-width: 440px; }
        .sk-kicker { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: #8f877b; margin-bottom: 14px; }
        .sk-title { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: clamp(44px, 9vw, 64px); line-height: 1; margin: 0 0 34px; letter-spacing: -.01em; }
        .sk-bar { position: relative; height: 3px; background: rgba(236, 230, 218, .12); border-radius: 3px; overflow: hidden; }
        .sk-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #d0714f; border-radius: 3px; transition: width .35s linear; }
        .sk-bar.sk-busy .sk-fill { width: 35% !important; transition: none; animation: sk-slide 1.3s ease-in-out infinite; }
        @keyframes sk-slide { 0% { left: -35%; } 100% { left: 100%; } }
        @media (prefers-reduced-motion: reduce) { .sk-bar.sk-busy .sk-fill { animation: none; width: 100% !important; opacity: .5; } }
        .sk-row { display: flex; justify-content: space-between; gap: 16px; margin-top: 14px; font-size: 14px; font-variant-numeric: tabular-nums; }
        .sk-muted { color: #8f877b; font-size: 13px; margin-top: 6px; }
        .sk-note { margin: 34px 0 0; font-size: 13px; line-height: 1.6; color: #8f877b; }
        .sk-retry { margin-top: 18px; font: inherit; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #ece6da;
            background: none; border: 1px solid rgba(236, 230, 218, .35); border-radius: 999px; padding: 9px 18px; cursor: pointer; }
        .sk-retry:hover { border-color: #ece6da; }
    </style>

<body>
    <script>
        // Error log: keeps the game's recent console messages so a report can show what happened. It is sent to
        // this site's server with the player's save code when the game crashes (Unity's error alert), or when the
        // player presses "Report a problem" in the cloud panel. Repeated lines are folded into one with a count.
        (function () {
            const LOG = [], MAX = 600, start = Date.now();
            let last = null, sent = 0;
            function add(level, args) {
                let text;
                try {
                    text = Array.from(args).map((a) => a instanceof Error ? (a.stack || String(a)) : typeof a === "string" ? a : JSON.stringify(a)).join(" ");
                } catch (e) { text = String(args[0]); }
                text = text.slice(0, 2000);
                // the intro scene has started (first lines the engine logs once a scene is up)
                if (!window.skSceneReady && /Couldn't find a Game Manager|^Unloading \d+ Unused Serialized files/.test(text)) window.skSceneReady = Date.now();
                if (last && last.level === level && last.text === text) { last.n++; return; }
                last = { t: Date.now() - start, level, text, n: 1 };
                LOG.push(last);
                if (LOG.length > MAX) LOG.shift();
            }
            for (const level of ["log", "info", "warn", "error"]) {
                const orig = console[level].bind(console);
                console[level] = function () { add(level, arguments); return orig.apply(null, arguments); };
            }
            window.addEventListener("error", (e) => add("error", [(e.message || "error") + " @ " + (e.filename || "") + ":" + (e.lineno || "")]));
            window.addEventListener("unhandledrejection", (e) => add("error", ["unhandled rejection: " + (e.reason && (e.reason.stack || e.reason))]));
            window.skSendReport = function (why) {
                let code = "";
                try { code = localStorage.getItem("neekoras-save-code") || ""; } catch (e) { /* storage blocked */ }
                if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(code) || sent >= 5) return Promise.resolve(false);
                sent++;
                const lines = LOG.map((l) => "[" + (l.t / 1000).toFixed(1) + "s] " + l.level.toUpperCase() + " " + l.text + (l.n > 1 ? "  (x" + l.n + ")" : ""));
                const body = ("reason: " + why + "\nwhen: " + new Date().toISOString() + "\nbrowser: " + navigator.userAgent +
                    "\nscreen: " + screen.width + "x" + screen.height + " @" + (window.devicePixelRatio || 1) + "\n\n" + lines.join("\n")).slice(-400000);
                // a crash report may be the last thing this tab does: keepalive survives closing it (64 KB limit)
                const crash = /^(crash|startup)/.test(why);
                return fetch("https://neekoras.com/games/silksong/api/reports?u=" + code,
                    crash ? { method: "POST", body: body.slice(-60000), keepalive: true } : { method: "POST", body: body })
                    .then((r) => r.ok).catch(() => false);
            };
            const origAlert = window.alert.bind(window);
            window.alert = function (msg) {
                if (/error occurred running the Unity content/i.test(String(msg))) window.skSendReport("crash: " + String(msg).slice(0, 400));
                return origAlert(msg);
            };
            // Frame timing and memory every 10 s, so a report shows where the frames drop. The browser's own frame
            // callbacks are counted (the engine draws on the same callbacks), plus the game's memory size.
            (function () {
                const raf = window.requestAnimationFrame.bind(window);
                let last = 0, frames = 0, worst = 0, slow = 0, windowStart = 0;
                function tick(t) {
                    if (last) {
                        const dt = t - last;
                        frames++;
                        if (dt > worst) worst = dt;
                        if (dt > 50) slow++;
                    } else windowStart = t;
                    last = t;
                    if (t - windowStart >= 10000 && !document.hidden) {
                        const M = window.skUnityInstance && window.skUnityInstance.Module;
                        const heap = M && M.HEAPU8 ? Math.round(M.HEAPU8.length / 1048576) : 0;
                        if (window.skUnityInstance) add("info", ["[perf] " + Math.round(frames * 1000 / (t - windowStart)) + " fps, worst frame " +
                            Math.round(worst) + " ms, " + slow + " frames over 50 ms, game memory " + heap + " MB"]);
                        frames = 0; worst = 0; slow = 0; windowStart = t;
                    }
                    raf(tick);
                }
                document.addEventListener("visibilitychange", () => { last = 0; });
                raf(tick);
            })();
            // a "Report a problem" button at the bottom of the cloud save panel
            (function addButton(tries) {
                const panel = document.getElementById("cloudsave-panel");
                if (!panel) { if (tries < 60) setTimeout(() => addButton(tries + 1), 1000); return; }
                const b = document.createElement("button");
                b.textContent = "Report a problem";
                b.style.cssText = "width:100%;margin-top:10px";
                b.onclick = async () => {
                    b.disabled = true; b.textContent = "Sending...";
                    const ok = await window.skSendReport("player report");
                    b.textContent = ok ? "Sent. Thanks!" : "Could not send";
                    setTimeout(() => { b.disabled = false; b.textContent = "Report a problem"; }, 4000);
                };
                panel.appendChild(b);
            })(0);
        })();
    </script>
    <script>
/*
 * MemGuard for the Silksong Unity 6 WebGPU port (neekoras.com/games/silksong).
 *
 * The wasm heap can never shrink, and Unity keeps loaded bundles in it, so a long session ends in
 * "Could not allocate memory: System out of memory!" followed ~1.4 s later by a "table index is out of
 * bounds" trap (malloc returned null). The only real fix is a page reload. This guard picks the moment:
 * right after the game has written a save file (bench, death, Save & Quit), when nothing is lost.
 *
 *   level "ok"    : nothing
 *   level "soft"  : after the next save, a small prompt offers a reload
 *   level "hard"  : after the next save, the page reloads by itself; until then a banner says to rest at a bench
 *
 * It also: learns the heap level a device died at, catches WebGPU device loss / WebGL context loss / fatal
 * engine errors (an overlay with Reload instead of Unity's alert), warns when a save could not be written,
 * and logs a memory line every 2 minutes so crash reports show the curve.
 *
 * Load it BEFORE w-pt.loader.js (it wraps GPUAdapter.requestDevice and IDBObjectStore.put).
 * After createUnityInstance resolves: MemGuard.attach(unityInstance).
 * In config.errorHandler: return MemGuard.onEngineError(message) (true = it showed its own overlay).
 */
(function (root) {
  "use strict";
  const MB = 1048576;
  const CFG = {
    saveDir: "/idbfs/f4bbfc2459fd6f7ca49076cea7369b2c/",
    saveFile: /\/user\d+\.dat$/,       // the game's save slots (not PlayerPrefs, not Restore_Points)
    heapMaxMB: 4080,                   // wasm memory maximum of this build (65280 pages)
    softFrac: 0.74,                    // of the limit, in Unity "used" MB:  4080 -> 3019
    hardFrac: 0.83,                    //                                    4080 -> 3386
    crashMargin: 400,                  // hard level sits this far below a "used" value we died at
    sampleMs: 120000,                  // GetMetricsInfo walks every dlmalloc chunk: keep it rare (it is also read at every save)
    slowSampleMs: 300000,              // used when one call took more than 25 ms
    logEveryMs: 120000,
    quietMs: 700,                      // no save transaction for this long = the save is finished
    minSessionMs: 5 * 60000,           // never auto-reload a session younger than this (no loops)
    precise: 3300,                     // heap MB from which the exact (slow) usage figure is read
    learnKey: "silksong-memguard-crash",
    flagKey: "silksong-memguard-reloaded",
  };

  // ---------- pure decision logic (tested in Node) ----------
  function limits(learned, deviceMemory, now) {
    // the limit only drops below the wasm maximum once this device has actually run out of memory (learned below)
    let limit = CFG.heapMaxMB;
    let soft = Math.round(limit * CFG.softFrac), hard = Math.round(limit * CFG.hardFrac);
    if (learned && now - learned.at < 21 * 864e5) {
      if (learned.heapMB && learned.heapMB < CFG.heapMaxMB - 64) {   // died below the wasm max: browser/device limit
        limit = learned.heapMB;
        soft = Math.round(limit * CFG.softFrac); hard = Math.round(limit * CFG.hardFrac);
      }
      if (learned.usedMB) hard = Math.min(hard, learned.usedMB - CFG.crashMargin);
      soft = Math.min(soft, hard - 250);
    }
    return { limit, soft, hard };
  }
  function levelFor(sample, lim) {
    if (!sample) return "ok";
    if (sample.usedMB != null) return sample.usedMB >= lim.hard ? "hard" : sample.usedMB >= lim.soft ? "soft" : "ok";
    // no Unity metrics: the heap length alone only says "near the end"
    return sample.heapMB >= Math.min(lim.limit, CFG.heapMaxMB) - 8 ? "soft" : "ok";
  }
  // Unity's out-of-memory text: "[ ALLOC_DEFAULT ] used: 3708943756B | ... reserved: 3789235267B"
  function parseOom(text) {
    const used = /ALLOC_DEFAULT \] used: (\d+)B/.exec(text), want = /Trying to allocate: (\d+)B/.exec(text);
    return { usedMB: used ? Math.round(+used[1] / MB) : 0, wantMB: want ? Math.round(+want[1] / MB) : 0 };
  }

  // ---------- environment ----------
  const hasDom = typeof document !== "undefined";
  const store = {
    get(k, s) { try { const v = (s ? sessionStorage : localStorage).getItem(k); return v && JSON.parse(v); } catch (e) { return null; } },
    set(k, v, s) { try { (s ? sessionStorage : localStorage).setItem(k, JSON.stringify(v)); } catch (e) { /* blocked */ } },
    del(k, s) { try { (s ? sessionStorage : localStorage).removeItem(k); } catch (e) { /* blocked */ } },
  };
  const log = (...a) => { try { console.log("[memguard]", ...a); } catch (e) { /* */ } };

  let inst = null, M = null, started = Date.now(), timer = 0, lastLog = 0, sampleCost = 0;
  let last = null, lim = limits(store.get(CFG.learnKey), root.navigator && navigator.deviceMemory, Date.now());
  let lastSaveAt = 0, pendingTx = 0, lastTxAt = 0, reloading = false, fatal = false, reported = false;
  let objects = 0;

  function sample() {
    if (!M || !M.HEAPU8) return null;
    const s = { heapMB: Math.round(M.HEAPU8.length / MB), usedMB: null, at: Date.now() };
    try {
      // GetMetricsInfo walks the whole heap (a full second on slow machines): only pay for it once the heap
      // has grown into the range where running out is possible; below that the heap length says enough.
      if (inst && typeof inst.GetMetricsInfo === "function" && s.heapMB >= Math.min(lim.soft, CFG.precise)) {
        const t = performance.now();
        const m = inst.GetMetricsInfo();           // usedWASMHeapSize = sbrk top - dlmalloc free bytes (mallinfo walk)
        sampleCost = performance.now() - t;
        if (m && m.usedWASMHeapSize > 0 && m.usedWASMHeapSize <= M.HEAPU8.length) s.usedMB = Math.round(m.usedWASMHeapSize / MB);
      }
    } catch (e) { /* metrics unavailable: heap length only */ }
    last = s;
    return s;
  }

  function tick() {
    if (fatal || reloading) return;
    const paused = root.TabPause && TabPause.isPaused && TabPause.isPaused();
    if (!paused) {
      const s = sample(), lvl = levelFor(s, lim);
      if (s && Date.now() - lastLog > CFG.logEveryMs) {
        lastLog = Date.now();
        log("heap " + s.heapMB + " MB, used " + s.usedMB + " MB, objects " + objects + ", level " + lvl +
          " (soft " + lim.soft + ", hard " + lim.hard + ", call " + sampleCost.toFixed(1) + " ms)");
      }
      if (lvl === "hard") ui.banner("Memory is almost full. Rest at a bench: the game will save and reload itself.");
      else ui.banner(null);
    }
    timer = setTimeout(tick, sampleCost > 25 ? CFG.slowSampleMs : CFG.sampleMs);
  }

  // ---------- the safe moment: a save file landed in IndexedDB ----------
  function onSaveWritten() {
    lastSaveAt = Date.now();
    if (!M || fatal || reloading) return;
    const lvl = levelFor(sample(), lim);
    if (lvl === "ok") return;
    log("save written at level " + lvl + " (used " + (last && last.usedMB) + " MB, heap " + (last && last.heapMB) + " MB)");
    if (lvl === "hard" && Date.now() - started > CFG.minSessionMs) whenQuiet(() => reloadNow("auto after save"));
    else ui.prompt("Memory is running low. Reload to keep playing smoothly (your progress is saved).", () => whenQuiet(() => reloadNow("player after save")));
  }
  function whenQuiet(fn) {
    const wait = () => {
      if (pendingTx || Date.now() - lastTxAt < CFG.quietMs) return setTimeout(wait, 150);
      fn();
    };
    wait();
  }
  function reloadNow(why) {
    if (reloading) return;
    reloading = true;
    store.set(CFG.flagKey, { at: Date.now(), why, usedMB: last && last.usedMB }, true);
    log("reloading: " + why);
    ui.overlay("Progress saved. Reloading to free memory...", false);
    try { if (M && M.pauseMainLoop) M.pauseMainLoop(); } catch (e) { /* */ }
    setTimeout(() => location.reload(), 400);
  }

  function hookIdb() {
    const P = root.IDBObjectStore && IDBObjectStore.prototype;
    if (!P || P.__memguard) return;
    const orig = P.put;
    P.put = function (value, key) {
      const req = orig.apply(this, arguments);
      try {
        if (this.name === "FILE_DATA" && this.transaction.db.name === "/idbfs" && typeof key === "string" && key.startsWith(CFG.saveDir)) {
          const tx = this.transaction, isSave = CFG.saveFile.test(key) && value && value.contents;
          if (!tx.__memguard) {
            tx.__memguard = { save: false };
            pendingTx++;
            const end = (ok) => () => {
              pendingTx--; lastTxAt = Date.now();
              if (!ok && tx.__memguard.save) {
                log("save write FAILED: " + (tx.error && tx.error.name));
                ui.prompt("Your browser could not write the save (" + ((tx.error && tx.error.name) || "error") + "). Free some disk space; progress since the last save may be lost.", null);
                if (root.skSendReport) skSendReport("save write failed: " + (tx.error && tx.error.name));
              } else if (ok && tx.__memguard.save) onSaveWritten();
            };
            tx.addEventListener("complete", end(true));
            tx.addEventListener("abort", end(false));
            tx.addEventListener("error", end(false));
          }
          if (isSave) tx.__memguard.save = true;
          lastTxAt = Date.now();
        }
      } catch (e) { /* never break the game's save */ }
      return req;
    };
    P.put.__memguard = P.__memguard = true;
  }

  // ---------- console: OOM line, loaded-object counts ----------
  function hookConsole() {
    for (const level of ["log", "error", "warn"]) {
      const orig = console[level];
      console[level] = function () {
        try {
          const t = typeof arguments[0] === "string" ? arguments[0] : "";
          if (t.indexOf("Could not allocate memory") !== -1) onOom(t);
          else if (t.indexOf("Loaded Objects now: ") !== -1) objects = parseInt(t.split("Loaded Objects now: ")[1], 10) || objects;
          else if (t === "Halting program.") fatal = true;
        } catch (e) { /* */ }
        return orig.apply(this, arguments);
      };
    }
  }
  function onOom(text) {
    if (fatal) return;
    const o = parseOom(text), heapMB = M && M.HEAPU8 ? Math.round(M.HEAPU8.length / MB) : 0;
    const prev = store.get(CFG.learnKey);
    // keep the lowest level seen; a single desktop crash at 4080 still lowers "hard" via usedMB
    const rec = { at: Date.now(), heapMB: Math.min(heapMB || 1e9, prev && prev.heapMB || 1e9), usedMB: Math.min(o.usedMB || 1e9, prev && prev.usedMB || 1e9), wantMB: o.wantMB };
    if (rec.heapMB === 1e9) rec.heapMB = 0;
    if (rec.usedMB === 1e9) rec.usedMB = 0;
    store.set(CFG.learnKey, rec);
    log("out of memory: heap " + heapMB + " MB, unity used " + o.usedMB + " MB, wanted " + o.wantMB + " MB, last save " +
      (lastSaveAt ? Math.round((Date.now() - lastSaveAt) / 1000) + " s ago" : "none this session"));
  }

  // ---------- GPU / context loss ----------
  function hookGpu() {
    const A = root.GPUAdapter && GPUAdapter.prototype;
    if (!A || A.__memguard) return;
    const orig = A.requestDevice;
    A.requestDevice = function () {
      return orig.apply(this, arguments).then((dev) => {
        try {
          dev.lost.then((info) => {
            if (reloading || (info && info.reason === "destroyed")) return;   // our reload, Quit, or page unload
            lost("WebGPU device lost: " + (info && info.message));
          });
          let ooms = 0;
          dev.addEventListener("uncapturederror", (e) => {
            const err = e.error;
            if (root.GPUOutOfMemoryError && err instanceof GPUOutOfMemoryError && ++ooms <= 3) log("GPU out of memory: " + err.message);
          });
        } catch (e) { /* */ }
        return dev;
      });
    };
    A.__memguard = true;
  }
  function lost(why) {
    if (fatal) return;
    fatal = true;
    log(why);
    report("crash: " + why);
    ui.overlay("The graphics stopped (" + why.split(":")[0] + "). Reload to keep playing." + saveNote(), true);
  }
  function saveNote() {
    return lastSaveAt ? " Your last save was " + Math.max(1, Math.round((Date.now() - lastSaveAt) / 60000)) + " min ago." : " Progress is kept up to your last bench.";
  }
  function report(why) {
    if (reported || !root.skSendReport) return;
    reported = true;
    skSendReport(why);
  }

  // Unity's errorHandler (loader.js) and the framework's main-loop catch both call it; return true to suppress the alert.
  function onEngineError(message) {
    const text = String(message && (message.stack || message.message) || message);
    const isFatal = fatal || /RuntimeError|Aborted\(|out of bounds|unreachable|out of memory/i.test(text);
    if (!isFatal) {                     // a wasm-stack error the engine may survive: report once, keep Unity's alert
      if (!api.__nonFatal && root.skSendReport) { api.__nonFatal = true; skSendReport("error: " + text.slice(0, 400)); }
      return false;
    }
    fatal = true;
    report("crash: " + text.slice(0, 400));
    const oom = /out of bounds|out of memory/i.test(text) || (store.get(CFG.learnKey) || {}).at > Date.now() - 10000;
    ui.overlay((oom ? "The game ran out of memory and stopped." : "The game hit an error and stopped.") + saveNote() +
      " Reloading usually fixes it.", true);
    return true;
  }

  // ---------- UI (inline styles, matches the page's note box) ----------
  const ui = (() => {
    const css = "position:fixed;z-index:99990;font:13px/1.45 Inter,system-ui,sans-serif;color:#ece6da;background:#16161fe8;border-radius:10px;";
    const btn = "font:inherit;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#ece6da;background:none;border:1px solid rgba(236,230,218,.35);border-radius:999px;padding:6px 14px;margin-left:8px;cursor:pointer;";
    let p = null, b = null, o = null;
    function el(style, html) { const d = document.createElement("div"); d.style.cssText = css + style; d.setAttribute("role", "status"); d.innerHTML = html; document.body.appendChild(d); return d; }
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
    return {
      prompt(text, onReload) {
        if (!hasDom || o) return;
        if (p) p.remove();
        p = el("left:50%;top:16px;transform:translateX(-50%);max-width:min(560px,calc(100vw - 32px));padding:10px 14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;",
          "<span style='flex:1 1 220px'>" + esc(text) + "</span>" + (onReload ? "<button data-a='r' style='" + btn + "border-color:#d0714f'>Reload now</button>" : "") + "<button data-a='x' style='" + btn + "'>" + (onReload ? "Later" : "OK") + "</button>");
        const me = p;
        me.addEventListener("click", (e) => { const a = e.target.getAttribute("data-a"); if (!a) return; me.remove(); if (p === me) p = null; if (a === "r" && onReload) onReload(); });
        setTimeout(() => { if (p === me) { me.remove(); p = null; } }, 30000);
      },
      banner(text) {
        if (!hasDom) return;
        if (!text) { if (b) { b.remove(); b = null; } return; }
        if (!b) b = el("right:14px;bottom:14px;padding:7px 12px;font-size:12px;pointer-events:none;border:1px solid #d0714f80;", "");
        b.textContent = text;
      },
      overlay(text, withButton) {
        if (!hasDom) return;
        if (p) { p.remove(); p = null; }
        if (b) { b.remove(); b = null; }
        if (!o) o = el("inset:0;border-radius:0;background:#121011ee;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:15px;", "");
        o.innerHTML = "<div style='max-width:440px'><p>" + esc(text) + "</p>" + (withButton ? "<button style='" + btn + "margin:14px 0 0;padding:9px 18px'>Reload</button>" : "") + "</div>";
        const k = o.querySelector("button");
        if (k) k.onclick = () => { reloading = true; location.reload(); };
      },
    };
  })();

    <script>
        const ui = (() => {
            const $ = (id) => document.getElementById(id);
            let start = 0, bytes = 0, total = 1, raf = 0, phase = "";
            function busy(on) { $("sk-bar").classList.toggle("sk-busy", on); }
            function eta() {
                const secs = (performance.now() - start) / 1000;
                if (secs < 3 || bytes <= 0) return "";
                const left = (total - bytes) / (bytes / secs);
                if (left < 60) return "Under a minute left";
                return "About " + Math.round(left / 60) + " min left";
            }
            function render() {
                raf = 0;
                let frac = Math.min(bytes / total, 1);
                if (frac > 0.999) frac = 1;
                const pct = Math.floor(frac * 100);
                if (frac === 1) $("sk-phase").textContent = "Saving to your browser";
                $("sk-fill").style.width = (frac * 100) + "%";
                $("sk-bar").setAttribute("aria-valuenow", pct);
                $("sk-pct").textContent = pct + "%";
                $("sk-mb").textContent = Math.round(bytes / 1048576) + " of " + Math.round(total / 1048576) + " MB";

                    $("sk-pct").textContent = "";
                    $("sk-mb").textContent = "";

                done() {

                    el.classList.add("sk-gone");

                    $("sk-pct").textContent = "";
                    $("sk-mb").textContent = "";

        const ENTRIES = [["packed-audio-voices_assets_all_4e4d5ad29d42bd4abdd5eadfce410be2.bundle", 100, 23888339, 23923429], ["packed-sprites-effects_assets_all_2e7bed7c909427b371b79d647bf138ee.bundle", 23888542, 21077768, 23619876], ["packed-scenes-hornet_scenes_all_c907e217c56bc36e9412cc713b6511b0.bundle", 44966411, 343949358, 504314372], ["packed-collections_assets_all_40fc2899a4bf13e2fdf4877fac117bfe.bundle", 388915868, 305936266, 349892025], ["packed-cinematics_assets_all_5ec2ac5cfb98b69438cb91f6e253bbbc.bundle", 694852232, 227298827, 228270727], ["packed-sprites-scenery_assets_all_39cc8fd6577083e676edf1e1a61fcaa9.bundle", 922151162, 177302834, 200750305], ["packed-audio-hornetmusic_assets_all_d7258aa531c7adbb862ab1f75c0a4758.bundle", 1099454101, 182954452, 183736066], ["packed-prefabs_assets_all_b19c0cf6b825f4cf18264a6c8f5765a6.bundle", 1282408648, 131206876, 147105252], ["packed-animations-props_assets_all_4d32c5a2554f1011290a2a758b19c15d.bundle", 1413615628, 112582650, 126271488], ["packed-sprites-ui_assets_all_f9a8ef56ecdd0a4b95785438aefb0b1a.bundle", 1526198376, 15721649, 117783892], ["packed-audio-hornetvoices_assets_all_6253ed781850c4087eb825002e1b63a0.bundle", 1541920131, 113615744, 113773103], ["packed-audio-sfx_assets_all_64a9c47145f1a68e9023751b5a4c32dd.bundle", 1655535972, 99941006, 100095084], ["packed-animations-hornet_assets_all_df96eceebcc563fac0a4c4d756348ec8.bundle", 1755477083, 79998592, 89583978], ["packed-fonts_assets_all_80af17da7b187150e3e4ec5346115b67.bundle", 1835475768, 48966670, 53402313], ["packed-sprites-hero_assets_all_038a432da5e4c2c15b9327d215fd7f32.bundle", 1884442538, 35649394, 40027523], ["packed-sprites-hornet_bosses_assets_all_4e40e4fa5157ac9fa9cbb2b12d9205fd.bundle", 1920092041, 34114295, 39051317], ["packed-animations-hornetnpcs_assets_all_b07b6c9740de43a1fa7c0ceef545d3a9.bundle", 1954206445, 29090015, 32653598], ["packed-animations-hornetenemies_assets_all_9f3d5906ad5a54b6c762e508aea802c3.bundle", 1983296572, 29055449, 32488514], ["packed-animations-effects_assets_all_9aab0f3b6b8f8c05cd2d618598948eea.bundle", 2012352127, 26832441, 30037913], ["packed-sprites-hornet_enemies_assets_all_1dc5e3e9aee3b4d2599cfacc771aa715.bundle", 2039184678, 22382755, 25741201], ["packed-animations-cutscene_assets_all_6088ab681e63b034a1b602249209347d.bundle", 2061567540, 21568824, 24006915]];

        const PATCHED = {

                el.setAttribute("role", "status");

        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

        // Put a saved bundle back together as one stream, piece by piece.
        async function savedBundle(bundle) {

                async pull(controller) {

                    const res = await realFetch(url, attempt > 1 ? Object.assign({}, init, { cache: "reload" }) : init);

            } catch (e) {

                throw e;
            }

        // stays while any running install still needs it, and the last two released are kept a moment longer.
        const parts = new Map();          // part number -> download promise
        const wants = new Map();          // part number -> running installs that still need it
        const recent = [];
        function wantPart(n) { wants.set(n, (wants.get(n) || 0) + 1); }
        function getPart(n) {
            let job = parts.get(n);
            if (!job) {
                job = fetchPart(n);
                const mine = job;
                job.catch(() => { if (parts.get(n) === mine) parts.delete(n); });
                parts.set(n, job);
            }
            return job;
        }
        function releasePart(n) {
            const left = (wants.get(n) || 1) - 1;
            if (left > 0) { wants.set(n, left); return; }
            wants.delete(n);
            recent.push(n);
            while (recent.length > 2) {
                const old = recent.shift();
                if (!wants.has(old)) parts.delete(old);
            }

            for (let n = first; n <= last; n++) wantPart(n);
            let released = first;             // parts before this one are no longer needed by this install
            const feeding = (async () => {
                let pos = start;
                const end = start + csize;
                while (pos < end) {
                    const n = Math.floor(pos / PART_SIZE) + 1;
                    // in the background, one part at a time with a short rest, so the game keeps its frame rate
                    for (let k = n; k <= last && k < n + (background && !waiting ? 1 : PARTS_AHEAD); k++) getPart(k);
                    const buf = await getPart(n);
                    const off = (n - 1) * PART_SIZE;
                    const to = Math.min(end - off, buf.length);
                    await writer.write(buf.subarray(pos - off, to));
                    pos = off + to;
                    releasePart(n);
                    released = n + 1;
                    if (background && !waiting) await sleep(400);
                }
                await writer.close();
            })();
            try { await Promise.all([feeding, saving]); }
            catch (e) {
                writer.abort(e).catch(() => {});
                for (let n = released; n <= last; n++) releasePart(n);
                throw e;
            }
        }

        // One bundle at a time per name, a few names at a time; what the game is waiting for goes first.
        const installs = new Map();       // name -> promise
        const queue = [];
        let running = 0;
        function pump() {
            while (running < MAX_INSTALLS && queue.length) {
                const job = queue.shift();
                running++;
                job.run().then(job.resolve, job.reject).finally(() => { running--; pump(); });
            }
        }
        async function isSaved(name) {
            return !!(await cache.match(keyFor(storeName(name), "done")));
        }
        function ensureBundle(name, urgent) {
            let p = installs.get(name);
            if (p) {
                if (urgent) {                 // move a queued background job to the front
                    const i = queue.findIndex((j) => j.name === name);
                    if (i > 0) queue.unshift(queue.splice(i, 1)[0]);
                }
                return p;
            }
            p = new Promise((resolve, reject) => {
                const entry = ENTRIES.find((e) => e[0] === name);
                const job = {
                    name, resolve, reject,
                    run: async () => {
                        if (await isSaved(name)) return;
                        if (PATCHED[name]) await fetchPatched(name);
                        else await installFromZip(entry, !urgent && !waiting);
                    }
                };
                if (urgent) queue.unshift(job); else queue.push(job);
                pump();
            });
            p.catch(() => installs.delete(name));   // a failed bundle can be tried again
            installs.set(name, p);
            return p;
        }

        // Count what is still missing, so progress can show "x of y MB".
        async function missingEntries() {
            // copies of a bundle saved before it was patched (or under an older patch) are no longer used
            for (const name of Object.keys(PATCHED)) {
                await forget(name);
                for (const tag of PATCHED[name].old || []) await forget(name + "." + tag);
            }
            const out = [];
            for (const e of ENTRIES) if (!(await isSaved(e[0]))) out.push(e);
            return out;
        }
        function sizeOf(entry) {
            return PATCHED[entry[0]] ? PATCHED[entry[0]].csize : entry[2];
        }

        // Once the game is running, fetch everything still missing, one bundle after another.
        async function downloadRest(missing) {
            const order = missing.slice().sort((a, b) => {
                const fa = FIRST.indexOf(a[0]), fb = FIRST.indexOf(b[0]);
                if (fa !== fb) return (fa === -1 ? 99 : fa) - (fb === -1 ? 99 : fb);
                return a[1] - b[1];
            });
            let failed = 0;
            for (const e of order) {
                // leave the connection to the game while it is still asking for files
                while (waiting || Date.now() - lastUrgent < QUIET_MS) await sleep(2000);
                let ok = false;
                for (let attempt = 1; attempt <= 3 && !ok; attempt++) {
                    try { await ensureBundle(e[0], false); ok = true; }
                    catch (err) {
                        console.warn("[loader] background download of " + e[0] + " failed (attempt " + attempt + ")", err);
                        if (err && err.name === "QuotaExceededError") {
                            note.show("Your browser has no room left to save the rest of the game. Free some disk space.");
                            return;
                        }
                        await sleep(5000 * attempt);
                    }
                }
                if (!ok) failed++;
            }
            if (failed) note.show("Some game files could not be downloaded. They will be fetched when the game needs them.");
            else note.show("The whole game is saved in this browser");
            note.hide(6000);
        }

        // The three engine files are gzip, and the loader in this build inflates them itself, so they
        // are passed on untouched. They are fetched here only so a failed download can be retried
        // against the other jsDelivr hosts.
        // Our own engine code: the port's wasm with 11 bytes changed (GCManager's 15 s cleanup cycle at most every
        // 60 s and its WebGL heap threshold 1024 MB instead of 384-512; SceneLoad skips its pre-load memory clear,
        // keeping the one after the new room is up, which removes one of the two freezes on every room change).
        const ENGINE_PATCH = { "w-pt.wasm.unityweb": PATCH + "w-pt.wasm.v1.unityweb" };
        async function buildFileUrl(file) {
            for (let attempt = 1; ; attempt++) {
                try {
                    const res = await realFetch(ENGINE_PATCH[file] || repoUrl(HOSTS[(attempt - 1) % HOSTS.length], "Build/" + file));
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    const blob = await res.blob();
                    const head = new Uint8Array(await blob.slice(0, 2).arrayBuffer());
                    if (head[0] !== 0x1f || head[1] !== 0x8b) throw new Error(file + " is not the expected gzip file");
                    return URL.createObjectURL(new Blob([blob], { type: "application/octet-stream" }));
                } catch (e) {
                    if (attempt >= 4) throw e;
                    await sleep(800 * attempt);
                }
            }
        }

        // The game's GCManager runs a full collection plus Resources.UnloadUnusedAssets every 15 s whenever the
        // managed heap is over its WebGL threshold (384 to 512 MB), which a running game always is: a 330 ms
        // freeze every 15 s. Raise that threshold in the game's memory to 1024 MB (the game clamps it back down,
        // so it is rewritten every 2 s). Addresses found by disassembling this exact build (build-guid 34f66b5d).
        function tuneGC(M) {
            const CLASS_SLOT = 8636420;
            return setInterval(() => {
                try {
                    if (!M || !M.HEAPU8) return;
                    const dv = new DataView(M.HEAPU8.buffer);
                    const klass = dv.getUint32(CLASS_SLOT, true);
                    if (!klass || (klass & 1) || !dv.getUint32(klass + 116, true)) return;   // class not set up yet
                    const statics = dv.getUint32(klass + 92, true);
                    if (statics && dv.getFloat64(statics + 24, true) < 1024) dv.setFloat64(statics + 24, 1024, true);
                } catch (e) { /* leave the game alone */ }
            }, 2000);
        }

        // Fast mode: lighter graphics settings written into the game's own PlayerPrefs before it starts
        // (keys from GameSettings.LoadVideoSettings in this build, all int32). Applied once per browser, so a
        // player's later choices in Options stick; ?fast=2 also switches the blurred-background effect off.
        // Only an existing PlayerPrefs file is edited (every other entry is kept); on a first visit the blur level
        // is set in the running game instead.
        const PREFS_PATH = "/idbfs/f4bbfc2459fd6f7ca49076cea7369b2c/PlayerPrefs";
        const FAST_KEY = "silksong-fast-v1";
        function prefsUpsert(b, values) {
            if (!b || b.length < 16 || String.fromCharCode(...b.subarray(0, 8)) !== "UnityPrf") return null;
            const dv = new DataView(b.buffer, b.byteOffset, b.byteLength), dec = new TextDecoder(), enc = new TextEncoder();
            const entries = [];
            let p = 16;
            const len = () => { const n = b[p++]; if (n < 0x80) return n; if (n === 0x80) { const v = dv.getUint32(p, true); p += 4; return v; } throw new Error("length"); };
            try {
                while (p < b.length) {
                    const kl = len(), k = dec.decode(b.subarray(p, p + kl)); p += kl;
                    const start = p, tag = b[p];
                    if (tag === 0xfe || tag === 0xfd) p += 5; else { const sl = len(); p += sl; }
                    if (p > b.length) return null;
                    entries.push([k, b.slice(start, p)]);
                }
            } catch (e) { return null; }
            const intVal = (v) => { const a = new Uint8Array(5); a[0] = 0xfe; new DataView(a.buffer).setInt32(1, v, true); return a; };
            for (const [k, v] of Object.entries(values)) {
                const i = entries.findIndex(([kk]) => kk === k);
                if (i >= 0) entries[i][1] = intVal(v); else entries.push([k, intVal(v)]);
            }
            const L = (n) => { if (n < 0x80) return Uint8Array.of(n); const a = new Uint8Array(5); a[0] = 0x80; new DataView(a.buffer).setUint32(1, n, true); return a; };
            const parts = [b.subarray(0, 16)];
            for (const [k, v] of entries) { const kb = enc.encode(k); parts.push(L(kb.length), kb, v); }
            const out = new Uint8Array(parts.reduce((s, x) => s + x.length, 0));
            let o = 0;
            for (const x of parts) { out.set(x, o); o += x.length; }
            return out;
        }
        function applyFastMode(values) {
            return new Promise((resolve) => {
                const req = indexedDB.open("/idbfs");
                req.onupgradeneeded = () => req.transaction.abort();      // no game data yet
                req.onerror = () => resolve(false);
                req.onsuccess = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains("FILE_DATA")) { db.close(); return resolve(false); }
                    let wrote = false;
                    const tx = db.transaction("FILE_DATA", "readwrite"), os = tx.objectStore("FILE_DATA");
                    const g = os.get(PREFS_PATH);
                    g.onsuccess = () => {
                        const cur = g.result && g.result.contents ? new Uint8Array(g.result.contents) : null;
                        const next = cur && prefsUpsert(cur, values);
                        if (next) { os.put({ timestamp: new Date(), mode: 33206, contents: next }, PREFS_PATH); wrote = true; }
                    };
                    tx.oncomplete = () => { db.close(); resolve(wrote); };
                    tx.onerror = tx.onabort = () => { db.close(); resolve(false); };
                };
            });
        }
        // In the running game: GameManager._instance -> gameSettings (+96) -> shaderQuality (+84), which the
        // BlurManager reads every frame. Class slot 9103020 is specific to this build.
        function setShaderQualityLive(M, q) {
            try {
                const dv = new DataView(M.HEAPU8.buffer), klass = dv.getUint32(9103020, true);
                if (!klass || (klass & 1) || !dv.getUint32(klass + 116, true)) return false;
                const gm = dv.getUint32(dv.getUint32(klass + 92, true), true);
                if (!gm) return false;
                const gs = dv.getUint32(gm + 96, true);
                if (!gs) return false;
                dv.setInt32(gs + 84, q, true);
                return true;
            } catch (e) { return false; }
        }

        // ?fps=30 caps the frame rate (the engine schedules frames with the page's requestAnimationFrame).
        function capFrameRate(fps) {
            const raf = window.requestAnimationFrame.bind(window);
            const minDt = 1000 / fps - 2;
            let last = 0;
            window.requestAnimationFrame = function (cb) {
                const step = (t) => { if (t - last >= minDt) { last = t; cb(t); } else raf(step); };
                return raf(step);
            };
        }

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement("script");
                s.src = src;
                s.onload = resolve;
                s.onerror = () => reject(new Error("could not load " + src));
                document.body.appendChild(s);
            });
        }

        (async () => {
            try {
                let inflates = false;
                try { new DecompressionStream("deflate-raw"); inflates = true; } catch (e) { /* old browser */ }
                if (!inflates || !window.caches || !window.WebAssembly) {
                    ui.fail("This browser is too old or has storage turned off. Try a current Chrome, Edge or Firefox window that is not private.");
                    return;
                }
                // One game tab at a time: two running Unity games rewrite the shared save store over each other.
                // A page being reloaded can still hold the lock for a moment, so wait for it a few seconds first;
                // if another tab really has the game, offer to move it here (that tab stops its game).
                if (navigator.locks) {
                    const channel = window.BroadcastChannel ? new BroadcastChannel("neekoras-unity") : null;
                    // hold the lock while this tab runs the game; let go when another tab takes the game over
                    const hold = () => new Promise((release) => {
                        if (!channel) return;
                        channel.onmessage = (ev) => {
                            if (ev.data !== "take-over") return;
                            try { if (window.skUnityInstance) window.skUnityInstance.Quit(); } catch (e) { /* stop anyway */ }
                            document.body.innerHTML = '<p style="font:16px Inter,system-ui,sans-serif;color:#ece6da;padding:40px">' +
                                "The game was moved to another tab.</p>";
                            release();
                        };
                    });
                    const wait = new AbortController();
                    const timer = setTimeout(() => wait.abort(), 8000);
                    const got = await new Promise((resolve) => {
                        navigator.locks.request("neekoras-unity", { signal: wait.signal },
                            () => { clearTimeout(timer); resolve(true); return hold(); })
                            .catch(() => resolve(false));
                    });
                    if (!got) {
                        await new Promise((resolve) => ui.fail("The game is already open in another tab. Play it here instead, or close that tab.",
                            "Already open in another tab", { label: "Play here instead", onClick: resolve }));
                        if (channel) channel.postMessage("take-over");
                        location.reload();
                        return;
                    }
                }
                // Ask the browser not to clear this site's storage (game files, saves and the save code) when space runs low.
                try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* ignore */ }
                for (const old of OLD_CACHES) { try { await caches.delete(old); } catch (e) { /* ignore */ } }
                cache = await caches.open(CACHE_NAME);
                const missing = await missingEntries();
                allBytes = missing.reduce((n, e) => n + sizeOf(e), 0) || 1;
                const titleMissing = missing.filter((e) => TITLE.some((p) => e[0].startsWith(p + "_")));
                titleBytes = titleMissing.reduce((n, e) => n + sizeOf(e), 0) || 1;
                const titleReady = Promise.all(titleMissing.map((e) => ensureBundle(e[0], true).catch(() => {})));
                if (!missing.length) ui.cached();
                if (!titleMissing.length) ui.starting(); else titleReady.then(() => ui.starting());

                const [dataUrl, frameworkUrl, codeUrl] = await Promise.all([
                    buildFileUrl("w-pt.data.unityweb"),
                    buildFileUrl("w-pt.framework.js.unityweb"),
                    buildFileUrl("w-pt.wasm.unityweb")
                ]);
                // The port is built for WebGPU and the engine uses it whenever the browser has it; without it the
                // engine falls back to WebGL 2. On WebGL 2 some blur/fog effects read the image they draw into and
                // show broken rectangles, so WebGL 2 is only forced when the address has ?webgl (for testing).
                if (/[?&]webgl\b/.test(location.search)) {
                    try { Object.defineProperty(Navigator.prototype, "gpu", { get: () => undefined, configurable: true }); } catch (e) { /* keep WebGPU */ }
                }
                const fps = parseInt((location.search.match(/[?&]fps=([0-9]+)/) || [])[1], 10);
                if (fps >= 15 && fps <= 60) capFrameRate(fps);
                await loadScript(repoUrl(HOSTS[0], "Build/w-pt.loader.js"));

                const config = {
                    dataUrl: dataUrl,
                    frameworkUrl: frameworkUrl,
                    codeUrl: codeUrl,
                    streamingAssetsUrl: repoUrl(HOSTS[0], "StreamingAssets"),
                    // The big bundles are already kept by this page; stop the engine copying them again.
                    cacheControl: function () { return "no-store"; },
                    // write saves to the browser as soon as the game makes them, not on the game's own later sync
                    autoSyncPersistentDataPath: true,
                    // every engine crash (out of memory included) sends the error log; returning false keeps Unity's alert
                    errorHandler: function (message) {
                        if (window.MemGuard) return window.MemGuard.onEngineError(message);
                        if (window.skSendReport) window.skSendReport("crash: " + String(message).slice(0, 400));
                        return false;
                    }
                };
                const container = document.querySelector("#unity-container");
                container.hidden = false;
                const canvas = document.querySelector("#unity-canvas");
                // The game locks the mouse during play (InputHandler.SetCursorEnabled sets Cursor.lockState). In the
                // browser, Escape then only releases the lock and the game never sees it, so pausing took two presses
                // and unpausing a third. It is a keyboard and controller game, so the lock is never taken; hiding
                // the cursor still works.
                canvas.requestPointerLock = function () { return Promise.resolve(); };
                if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                    config.devicePixelRatio = 1;
                    const warn = document.querySelector("#unity-mobile-warning");
                    warn.style.display = "block";
                    setTimeout(() => { warn.style.display = "none"; }, 5000);
                } else {
                    // Draw at the window's size, not the screen's pixel density (a Retina screen would be 4 times the
                    // pixels and a lot slower). ?scale=0.75 draws smaller still for slow computers.
                    // By default draw at most about 1440 pixels wide; bigger windows are scaled up by the browser.
                    const scale = parseFloat((location.search.match(/[?&]scale=([0-9.]+)/) || [])[1]);
                    config.devicePixelRatio = scale > 0.3 && scale <= 2 ? scale : Math.min(1, 1440 / window.innerWidth);
                    const resizeCanvas = () => {
                        canvas.width = window.innerWidth;
                        canvas.height = window.innerHeight;
                        canvas.style.width = window.innerWidth + "px";
                        canvas.style.height = window.innerHeight + "px";
                    };
                    resizeCanvas();
                    window.addEventListener("resize", resizeCanvas);
                }
                if (window.csReady) await window.csReady;      // a cloud restore is written before the game reads saves
                const fastLevel = /[?&]fast=2\b/.test(location.search) ? 2 : /[?&]fast=0\b/.test(location.search) ? -1 : 1;
                let fastDone = false;
                try { fastDone = localStorage.getItem(FAST_KEY) === "1"; } catch (e) { /* storage blocked */ }
                let fastLive = false;
                if (fastLevel === 2 || (fastLevel === 1 && !fastDone)) {
                    const values = { ShaderQuality: fastLevel === 2 ? 2 : 0, VidParticles: 0, VidNoise: 0, VidDithering: 0, VidVSync: 1 };
                    if (await applyFastMode(values)) { try { localStorage.setItem(FAST_KEY, "1"); } catch (e) { /* ignore */ } }
                    else fastLive = true;                      // first visit: no settings file yet
                }
                const unityInstance = await createUnityInstance(canvas, config, () => {});
                await titleReady;
                // The engine now loads the title screen's files, which takes a while behind a black canvas: keep the
                // loading screen up until its first scene has started (at most 150 s).
                ui.phase("Loading the title screen");
                const shownAt = Date.now();
                while (!window.skSceneReady && Date.now() - shownAt < 150000) await sleep(300);
                window.skUnityInstance = unityInstance;
                tuneGC(unityInstance.Module);
                // watches memory and, when it gets critical, reloads right after the next save instead of crashing
                if (window.MemGuard) window.MemGuard.attach(unityInstance);
                if (fastLive) {
                    const q = fastLevel === 2 ? 2 : 0;
                    let tries = 0;
                    const t = setInterval(() => { if (setShaderQualityLive(unityInstance.Module, q) || ++tries > 60) clearInterval(t); }, 2000);
                }
                if (window.TabPause) TabPause.attach(unityInstance.Module);
                URL.revokeObjectURL(dataUrl);
                URL.revokeObjectURL(codeUrl);
                ui.done();
                canvas.style.display = "block";
                gameShown = true;
                lastUrgent = Date.now();
                if (missing.length) { progress(); downloadRest(missing); }
            } catch (e) {
                console.error(e);
                if (window.skSendReport) window.skSendReport("startup: " + (e && (e.stack || e.message) || e));
                if (e && e.name === "QuotaExceededError") {
                    ui.fail("Your browser has no room left to save the game (about 2.5 GB). Free some disk space, then reload.");
                } else {
                    ui.fail();
                }
            }
        })();
    </script>
</body>

</html>
