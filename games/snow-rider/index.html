<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Snow Rider 3D</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #unity-canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; outline: none; background: #000; }
    </style>
  </head>
  <body>
    <script src="/games/shared/loader.js?v=2"></script>
    <script>
      var GAME_BYTES = 17955268; // loader + framework + data + wasm
      var gameLoader = GameLoader({
        title: "Snow Rider 3D",
        totalBytes: GAME_BYTES,
        note: "The first load is about 17 MB. After that it is kept in this browser and starts much faster.",
      });
    </script>
    <script src="/games/shared/tabpause.js?v=2"></script>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <script src="gdsdk.js?v=2"></script>
    <script src="webglscreen.js?v=1"></script>
    <script src="Build/snowrider3d_gd_4_2.loader.js"></script>
    <script>
      var canvas = document.getElementById("unity-canvas");
      createUnityInstance(canvas, {
        dataUrl: "Build/snowrider3d_gd_4_2.data.unityweb",
        frameworkUrl: "Build/snowrider3d_gd_4_2.framework.js.unityweb?v=2",
        codeUrl: "Build/snowrider3d_gd_4_2.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Snow Rider 3d",
        productName: "Snow Rider 3d",
        productVersion: "4.3",
        // Retina screens would render at twice the window size; keep the render width near 1920 pixels.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, Math.max(1, 1920 / window.innerWidth)),
      }, function (progress) {
        // Unity reports the download as 0 to 0.9 and its own start-up as the rest, so map the
        // download part onto bytes (MB and time left, like the other games) and switch at 0.9.
        if (progress < 0.9) gameLoader.download(Math.round(progress / 0.9 * GAME_BYTES));
        else gameLoader.starting();
      }).then(function (instance) {
        gameLoader.done();
        TabPause.attach(instance.Module);
        canvas.focus();
      }).catch(function (e) {
        console.error(e);
        gameLoader.fail();
      });
    </script>
  </body>
</html>
