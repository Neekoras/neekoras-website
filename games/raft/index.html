<!DOCTYPE html>
<html lang="en">

<head>
    <base href="/games/raft/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Raft</title>
    <!-- Web port from github.com/genizy/web-port (raft). The build files live in Build/ next to this page. -->
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            background: #000;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        #unity-container canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
    </style>
</head>

<body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <script src="/games/shared/loader.js?v=8"></script>
    <script>
        var gameLoader = GameLoader({
            title: "Raft",
            totalBytes: 91832319, // the data and code parts below
            note: "The first load is about 90 MB. Your browser keeps it afterward, so the next visit starts faster.",
        });
    </script>
    <div id="unity-container"></div>
    <script src="/games/shared/tabpause.js?v=2"></script>
    <script src="cloudsave.js?v=20261123"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
        var BUILD = "Build/";

        // Parts are saved in the browser after the first visit, so later visits skip the download.
        // Change the version when the build files change, so old parts are never mixed in.
        var CACHE_NAME = "raft-v1";
        var cachePromise = ("caches" in window)
            ? caches.open(CACHE_NAME).catch(() => null)
            : Promise.resolve(null);

        var loadedBytes = 0;
        function addBytes(n) {
            loadedBytes += n;
            gameLoader.download(loadedBytes);
        }

        // Gets one part: from the browser's saved copy if there is one, otherwise from the network,
        // adding its bytes to the loading screen as they arrive and saving it for next time.
        async function fetchPart(url) {
            const cache = await cachePromise;
            if (cache) {
                const hit = await cache.match(url).catch(() => null);
                if (hit) {
                    const blob = await hit.blob();
                    addBytes(blob.size);
                    return blob;
                }
            }
            const res = await fetch(url);
            if (!res.ok) throw new Error("HTTP " + res.status + " for " + url);
            const reader = res.body.getReader();
            const chunks = [];
            for (;;) {
                const step = await reader.read();
                if (step.done) break;
                chunks.push(step.value);
                addBytes(step.value.length);
            }
            const blob = new Blob(chunks);
            // A full disk or a browser that limits storage only means the next visit downloads again.
            if (cache) cache.put(url, new Response(blob)).catch(() => {});
            return blob;
        }

        // Fetches the numbered parts and joins them, in order, into one file the engine can read.
        async function mergeFiles(name, count) {
            const blobs = await Promise.all(
                Array.from({ length: count }, (_, i) => fetchPart(BUILD + name + ".part" + (i + 1))));
            return URL.createObjectURL(new Blob(blobs));
        }

        (async () => {
            const [dataUrl, codeUrl] = await Promise.all([
                mergeFiles("Raft-WEBGL.data.unityweb", 3),
                mergeFiles("Raft-WEBGL.asm.code.unityweb", 2),
            ]);

            // The port's UnityLoader.js is patched to read the merged data and code from these two globals.
            window.dataUrll = dataUrl;
            window.asmUrll = codeUrl;

            gameLoader.starting();
            UnityLoader.instantiate("unity-container", BUILD + "Raft-WEBGL.json", {
                onProgress: function () {},
                Module: {
                    onRuntimeInitialized: function () {
                        gameLoader.done();
                        TabPause.attach(this);
                    },
                },
            });
        })().catch((e) => {
            console.error(e);
            gameLoader.fail(e && e.message ? e.message : "The game could not load.");
        });
    </script>
</body>

</html>
