<!DOCTYPE html>
<html lang="en-us">

<head>
    <base href="/games/ultrakill/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>ULTRAKILL</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            background: #000;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
    </style>
</head>

<body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <script src="/games/shared/loader.js?v=2"></script>
    <script>
        var gameLoader = GameLoader({
            title: "ULTRAKILL",
            totalBytes: 97607053, // the data and wasm parts below
            note: "The first load is about 93 MB, so give it a minute on a slow connection.",
        });
    </script>
    <canvas id="unity-canvas" tabindex="-1" hidden></canvas>
    <script src="/games/shared/keylock.js?v=1" data-target="#unity-canvas"></script>
    <script src="/games/shared/tabpause.js?v=2"></script>
    <script src="Build/ultrakill.loader.js"></script>
    <script>
        var canvas = document.querySelector("#unity-canvas");
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            // Mobile device style: fill the whole browser client area with the game canvas:
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            canvas.style.width = "100%";
            canvas.style.height = "100%";
            canvas.style.position = "fixed";
            document.body.style.textAlign = "left";
        } else {
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                canvas.style.width = window.innerWidth + "px";
                canvas.style.height = window.innerHeight + "px";
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        // Streams a file, adding its bytes to the loading screen as they arrive.
        var loadedBytes = 0;
        async function fetchTracked(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error("HTTP " + res.status + " for " + url);
            const reader = res.body.getReader();
            const chunks = [];
            for (;;) {
                const step = await reader.read();
                if (step.done) break;
                chunks.push(step.value);
                loadedBytes += step.value.length;
                gameLoader.download(loadedBytes);
            }
            return new Blob(chunks);
        }

        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {
                let buffers = [];

                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        let mergedBlob = new Blob(buffers);
                        let mergedFileUrl = URL.createObjectURL(mergedBlob);
                        resolve(mergedFileUrl);
                        return;
                    }
                    fetchTracked(fileParts[index]).then((data) => {
                        buffers.push(data);
                        fetchPart(index + 1);
                    }).catch(reject);
                }
                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }
        Promise.all([
            mergeFiles(getParts("Build/ultrakill.data.unityweb", 1, 4)),
            mergeFiles(getParts("Build/ultrakill.wasm.unityweb", 1, 2))
        ]).then(([dataUrl, wasmurl]) => {
            gameLoader.starting();
            document.querySelector("#unity-canvas").hidden = false;
            createUnityInstance(document.querySelector("#unity-canvas"), {
                dataUrl: dataUrl,
                frameworkUrl: "Build/ultrakill.framework.js.unityweb",
                codeUrl: wasmurl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Hakita and Cake Logic",
                productName: "ULTRAKILL",
                productVersion: "1.4",
                // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
                // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
            }, () => gameLoader.starting()).then((instance) => {
                gameLoader.done();
                TabPause.attach(instance.Module);
            });
        }).catch((e) => {
            console.error(e);
            gameLoader.fail();
        });
    </script>
    <script src="/games/ultrakill/cloudsave.js?v=6"></script>
</body>

</html>
