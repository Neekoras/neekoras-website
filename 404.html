<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Nicholas Lin</title>
<meta name="description" content="There is no page at this address.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050b14">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b14;--ink:#eef2f6;--soft:#7f8c9c;--line:#17222f;--sig:#ff7a2e;--glow:#ff4fa3;--well:#0a1320;--edge:#2a3747;--on:#0b0710;--dim:#74818f;
  --out:cubic-bezier(.16,1,.3,1);--sans:"Schibsted Grotesk",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;--pad:clamp(16px,3vw,40px)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100svh;display:flex;flex-direction:column;padding:0 var(--pad)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
::selection{background:var(--glow);color:var(--bg)}
.mono{font:400 12px/1.4 var(--mono);letter-spacing:.02em;text-transform:uppercase}
.soft{color:var(--soft)}

.bar{display:flex;justify-content:space-between;align-items:center;height:48px}
.bar a{display:inline-flex;align-items:center;height:44px;color:var(--soft);transition:color .2s}
.bar a:hover{color:var(--ink)}
.bar .me{color:var(--ink)}

main{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(48px,10vh,120px) 0 clamp(40px,8vh,88px)}
h1{font:700 clamp(56px,11.5vw,176px)/.86 var(--sans);letter-spacing:-.055em;text-transform:lowercase}
h1 i{font-style:normal;color:var(--sig)}
.lede{font-size:clamp(18px,1.6vw,22px);line-height:1.4;max-width:34ch;margin-top:28px}
.spec{margin-top:clamp(32px,6vh,56px);max-width:560px;border-top:1px solid var(--ink)}
.spec div{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.spec dt{color:var(--soft)}
.spec dd{margin:0;overflow-wrap:anywhere;text-transform:none}
.spec a{display:inline-flex;align-items:center;min-height:44px;margin:-14px 0;text-decoration:underline;text-decoration-color:var(--edge);text-underline-offset:4px;text-transform:uppercase;transition:text-decoration-color .2s}
.spec a:hover{text-decoration-color:var(--ink)}
.spec a+a{margin-left:20px}

footer{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--line);padding:6px 0 12px;color:var(--soft)}
footer a{display:inline-flex;align-items:center;min-height:44px;transition:color .2s}
footer a:hover{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important;transition-delay:0ms!important}}
</style>
</head>
<body>

<nav class="bar mono" aria-label="Site">
  <a class="me" href="/">Nicholas Lin</a>
  <a href="/games">Arcade</a>
</nav>

<main>
  <h1>nothing here<i>.</i></h1>
  <p class="lede">There is no page at this address. The link you followed is old or mistyped.</p>
  <dl class="spec mono">
    <div><dt>Error</dt><dd>404</dd></div>
    <div><dt>Address</dt><dd id="path">/</dd></div>
    <div><dt>Go to</dt><dd><a href="/">Homepage</a><a href="/games">Arcade</a></dd></div>
  </dl>
</main>

<footer class="mono">
  <span>© <span id="yr">2026</span> Nicholas Lin</span>
  <a href="/">Homepage</a>
</footer>

<script>
document.getElementById("path").textContent = location.pathname;
document.getElementById("yr").textContent = new Date().getFullYear();
</script>
</body>
</html>
