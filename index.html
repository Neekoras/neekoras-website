<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>neekoras.com</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .grid-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(99,102,241,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99,102,241,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
        }
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            animation: float linear infinite;
            opacity: 0;
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
        .glow-orb {
            position: fixed;
            width: 600px; height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99,102,241,0.15), transparent 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            animation: pulse 4s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: translate(-50%,-50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%,-50%) scale(1.2); opacity: 1; }
        }
        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
        }
        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8, #6366f1, #a78bfa, #818cf8);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient 3s ease infinite;
            margin-bottom: 1rem;
            letter-spacing: -2px;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .tagline {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            color: #9ca3af;
            margin-bottom: 2.5rem;
            font-weight: 400;
        }
        .tagline .cursor {
            display: inline-block;
            width: 2px; height: 1.2em;
            background: #6366f1;
            margin-left: 4px;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink { 50% { opacity: 0; } }
        .links {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .links a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border: 1px solid rgba(99,102,241,0.3);
            border-radius: 12px;
            color: #c7d2fe;
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            background: rgba(99,102,241,0.05);
            backdrop-filter: blur(10px);
        }
        .links a:hover {
            border-color: rgba(99,102,241,0.8);
            background: rgba(99,102,241,0.15);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(99,102,241,0.2);
            color: #e0e7ff;
        }
        .status-bar {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%;
            padding: 0.75rem 1.5rem;
            background: rgba(10,10,15,0.8);
            border-top: 1px solid rgba(99,102,241,0.1);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #6b7280;
            display: flex;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        .status-dot {
            display: inline-block;
            width: 8px; height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 6px;
            animation: statusPulse 2s ease-in-out infinite;
        }
        @keyframes statusPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .scanline {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 2px,
                rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
            );
            pointer-events: none;
            z-index: 3;
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="glow-orb"></div>
    <div class="scanline"></div>
    <div class="particles" id="particles"></div>
    <div class="container">
        <div class="logo">neekoras</div>
        <div class="tagline">
            <span id="typed"></span><span class="cursor"></span>
        </div>
        <div class="links">
            <a href="https://github.com/Neekoras" target="_blank">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                GitHub
            </a>
            <a href="https://www.linkedin.com/in/nicholas-lin-086600390/" target="_blank">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                LinkedIn
            </a>
        </div>
    </div>
    <div class="status-bar">
        <span><span class="status-dot"></span>all systems operational</span>
        <span>neekoras.com</span>
    </div>
    <script>
        const phrases = [
            "developer // hackathon winner // builder",
            "6x hackathon winner 🏆",
            "shipping code & breaking things",
            "deep learning • AI • cloud",
            "cybersecurity researcher 🔒"
        ];
        let phraseIdx = 0, charIdx = 0, deleting = false;
        const typed = document.getElementById('typed');
        function type() {
            const current = phrases[phraseIdx];
            if (!deleting) {
                typed.textContent = current.substring(0, charIdx + 1);
                charIdx++;
                if (charIdx === current.length) {
                    deleting = true;
                    setTimeout(type, 2000);
                    return;
                }
                setTimeout(type, 60);
            } else {
                typed.textContent = current.substring(0, charIdx - 1);
                charIdx--;
                if (charIdx === 0) {
                    deleting = false;
                    phraseIdx = (phraseIdx + 1) % phrases.length;
                    setTimeout(type, 400);
                    return;
                }
                setTimeout(type, 30);
            }
        }
        type();
        const particlesEl = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 4 + 2;
            const colors = ['rgba(99,102,241,0.6)', 'rgba(167,139,250,0.5)', 'rgba(129,140,248,0.4)'];
            p.style.cssText = 'width:' + size + 'px;height:' + size + 'px;left:' + (Math.random()*100) + '%;background:' + colors[Math.floor(Math.random()*colors.length)] + ';animation-duration:' + (Math.random()*10+8) + 's;animation-delay:' + (Math.random()*10) + 's;';
            particlesEl.appendChild(p);
        }
    </script>
</body>
</html>
