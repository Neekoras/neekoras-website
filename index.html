<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>neekoras</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;700&display=swap');
        :root {
            --bg: #09090b; --surface: #111113; --border: #1e1e22;
            --text: #fafafa; --muted: #71717a;
            --accent: #10b981; --accent-dim: rgba(16,185,129,0.06); --accent-border: rgba(16,185,129,0.2);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; overflow-x:hidden; }
        nav { position:fixed; top:0; left:0; width:100%; padding:1rem 2rem; display:flex; justify-content:space-between; align-items:center; z-index:100; background:rgba(9,9,11,0.8); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); }
        nav .brand { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:1rem; color:var(--text); text-decoration:none; }
        nav .brand span { color:var(--accent); }
        nav .nav-links { display:flex; gap:1.5rem; list-style:none; }
        nav .nav-links a { color:var(--muted); text-decoration:none; font-size:0.8rem; font-family:'JetBrains Mono',monospace; transition:color 0.2s; }
        nav .nav-links a:hover { color:var(--text); }
        .hero { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2rem; position:relative; }
        .hero canvas { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
        .hero-content { position:relative; z-index:2; }
        .hero h1 { font-family:'JetBrains Mono',monospace; font-size:clamp(2.5rem,8vw,5rem); font-weight:700; letter-spacing:-3px; margin-bottom:0.5rem; }
        .hero h1 span { color:var(--accent); }
        .hero .tagline { font-size:clamp(0.9rem,2vw,1.1rem); color:var(--muted); margin-bottom:2rem; min-height:1.6em; }
        .hero .tagline .cursor { display:inline-block; width:2px; height:1.1em; background:var(--accent); margin-left:2px; animation:blink 1s step-end infinite; vertical-align:text-bottom; }
        @keyframes blink { 50%{opacity:0;} }
        .scroll-hint { position:absolute; bottom:2rem; color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:0.7rem; animation:bob 2s ease-in-out infinite; }
        @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(6px);} }
        .playground { padding:4rem 2rem; max-width:1200px; margin:0 auto; }
        .section-title { font-family:'JetBrains Mono',monospace; font-size:0.75rem; color:var(--accent); text-transform:uppercase; letter-spacing:3px; margin-bottom:2.5rem; }
        .toys-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:1rem; }
        .toy-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; transition:border-color 0.3s; }
        .toy-card:hover { border-color:var(--accent-border); }
        .toy-canvas { width:100%; height:260px; display:block; cursor:crosshair; }
        .toy-info { padding:1rem 1.25rem; display:flex; justify-content:space-between; align-items:center; }
        .toy-name { font-family:'JetBrains Mono',monospace; font-size:0.8rem; color:var(--text); }
        .toy-hint { font-size:0.65rem; color:var(--muted); font-family:'JetBrains Mono',monospace; }
        .about { padding:6rem 2rem; max-width:640px; margin:0 auto; border-top:1px solid var(--border); }
        .about p { color:var(--muted); line-height:1.8; font-size:0.95rem; margin-bottom:1.5rem; }
        .about p strong { color:var(--text); font-weight:500; }
        .about .links { display:flex; gap:0.75rem; flex-wrap:wrap; margin-top:2rem; }
        .about .links a { display:inline-flex; align-items:center; gap:0.5rem; padding:0.5rem 1rem; border:1px solid var(--border); border-radius:8px; color:var(--muted); text-decoration:none; font-family:'JetBrains Mono',monospace; font-size:0.75rem; transition:all 0.2s; }
        .about .links a:hover { border-color:var(--accent-border); color:var(--text); background:var(--accent-dim); }
        </div>
        <div class="scroll-hint">↓ scroll</div>
    </section>
    <section class="playground" id="play">
        <div class="section-title">// playground</div>
        <div class="toys-grid">
            <div class="toy-card"><canvas class="toy-canvas" id="gravityBalls"></canvas><div class="toy-info"><span class="toy-name">gravity balls</span><span class="toy-hint">click to spawn</span></div></div>
            <div class="toy-card"><canvas class="toy-canvas" id="rippleCanvas"></canvas><div class="toy-info"><span class="toy-name">ripples</span><span class="toy-hint">click anywhere</span></div></div>
            <div class="toy-card"><canvas class="toy-canvas" id="dotGrid"></canvas><div class="toy-info"><span class="toy-name">magnetic grid</span><span class="toy-hint">move your mouse</span></div></div>
            <div class="toy-card"><canvas class="toy-canvas" id="soundPad"></canvas><div class="toy-info"><span class="toy-name">synth pad</span><span class="toy-hint">click to play</span></div></div>
            <div class="toy-card"><canvas class="toy-canvas" id="snakeGame"></canvas><div class="toy-info"><span class="toy-name">snake</span><span class="toy-hint">arrow keys / swipe</span></div></div>
            <div class="toy-card"><canvas class="toy-canvas" id="matrixRain"></canvas><div class="toy-info"><span class="toy-name">matrix rain</span><span class="toy-hint">hover to distort</span></div></div>
        </div>
    </section>
    <section class="about" id="about">
        <div class="section-title">// about</div>
        <p>Hey, I'm <strong>Nicholas</strong>. I build things — mostly code, sometimes chaos. 6x hackathon winner, cybersecurity researcher, and lead software engineer at Jobinba.</p>
        <p>I like deep learning, cloud infra, breaking into things (ethically), and shipping projects at 3am before a deadline. Currently exploring the intersection of AI and well-being.</p>
