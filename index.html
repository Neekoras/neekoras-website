<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>neekoras</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;700&display=swap');

        :root {
            --bg: #09090b;
            --surface: #18181b;
            --border: #27272a;
            --text: #fafafa;
            --muted: #71717a;
            --accent: #10b981;
            --accent-dim: rgba(16, 185, 129, 0.08);
            --accent-border: rgba(16, 185, 129, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .noise {
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
        }

        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 700;
            color: var(--text);
            letter-spacing: -2px;
            margin-bottom: 0.5rem;
        }

        .logo span {
            color: var(--accent);
        }

        .divider {
            width: 48px;
            height: 2px;
            background: var(--accent);
            margin: 1.5rem auto;
            border-radius: 1px;
        }

        .tagline {
            font-size: clamp(0.95rem, 2vw, 1.15rem);
            color: var(--muted);
            margin-bottom: 2.5rem;
            font-weight: 400;
            min-height: 1.8em;
        }

        .tagline .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: var(--accent);
            margin-left: 2px;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink { 50% { opacity: 0; } }

        .links {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .links a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.25rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            transition: all 0.2s ease;
            background: transparent;
        }

        .links a:hover {
            border-color: var(--accent-border);
            color: var(--text);
            background: var(--accent-dim);
        }

        .links a svg {
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .links a:hover svg {
            opacity: 1;
        }

        .status-bar {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%;
            padding: 0.6rem 1.5rem;
            background: var(--bg);
            border-top: 1px solid var(--border);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            z-index: 10;
        }

        .status-dot {
            display: inline-block;
            width: 6px; height: 6px;
            background: var(--accent);
            border-radius: 50%;
            margin-right: 6px;
        }
    </style>
</head>
<body>
    <div class="noise"></div>
    <div class="container">
        <div class="logo">neeko<span>r</span>as</div>
        <div class="divider"></div>
        <div class="tagline">
            <span id="typed"></span><span class="cursor"></span>
        </div>
        <div class="links">
            <a href="https://github.com/Neekoras" target="_blank">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                github
            </a>
            <a href="https://www.linkedin.com/in/nicholas-lin-086600390/" target="_blank">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                linkedin
            </a>
        </div>
    </div>

    <div class="status-bar">
        <span><span class="status-dot"></span>operational</span>
        <span>neekoras.com</span>
    </div>

    <script>
        const phrases = [
            "developer & hackathon winner",
            "6x hackathon champion",
            "shipping code, breaking things",
            "deep learning · AI · cloud",
            "cybersecurity researcher"
        ];
        let pi = 0, ci = 0, del = false;
        const el = document.getElementById('typed');
        function type() {
            const p = phrases[pi];
            if (!del) {
                el.textContent = p.substring(0, ci + 1);
                ci++;
                if (ci === p.length) { del = true; setTimeout(type, 2200); return; }
                setTimeout(type, 55);
            } else {
                el.textContent = p.substring(0, ci - 1);
                ci--;
                if (ci === 0) { del = false; pi = (pi + 1) % phrases.length; setTimeout(type, 350); return; }
                setTimeout(type, 25);
            }
        }
        type();
    </script>
</body>
</html>
